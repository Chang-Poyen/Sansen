<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sansen · 教材抽取数据库</title>
<link rel="stylesheet" href="../derivations/ch02/assets/katex/katex.min.css">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172d36;background:#f2f5f4;font-size:15px}*{box-sizing:border-box}body{margin:0}header{padding:28px 34px 22px;background:#153c40;color:#fff;border-bottom:5px solid #d7b86d}header .eyebrow{font-size:11px;letter-spacing:3px;color:#bad3d0}h1{font-size:29px;margin:9px 0 10px;font-weight:650}header p{margin:0;color:#c6dcda;line-height:1.7;max-width:1000px}.stats{display:flex;gap:28px;margin-top:21px;flex-wrap:wrap}.stat b{display:block;font-size:25px;color:#fff}.stat span{font-size:12px;color:#bbcfce}.workspace{display:grid;grid-template-columns:335px minmax(0,1fr);max-width:1600px;margin:auto;min-height:85vh}aside{background:#e9efed;border-right:1px solid #d3dfda;padding:20px;position:sticky;top:0;height:100vh;overflow:auto}.filter{display:block;width:100%;border:1px solid #becfca;background:white;border-radius:6px;padding:10px;font:inherit;margin-bottom:9px;color:#173b3e}#count{font-size:12px;color:#4d6562;margin:15px 0}.item{display:block;width:100%;background:transparent;text-align:left;border:0;border-bottom:1px solid #cddbd6;padding:13px 10px;cursor:pointer;color:#213e40;border-radius:4px}.item.active{background:#fff;border-left:4px solid #b39246}.item small{font-size:11px;color:#637c77;display:block;margin-bottom:4px}.item strong{font-size:14px;font-weight:550;line-height:1.4}.pager{display:flex;align-items:center;justify-content:space-between;padding:16px 0}.pager button{padding:8px 14px;background:white;border:1px solid #c5d3cf;border-radius:4px;cursor:pointer}.pager span{font-size:12px}main{padding:30px;max-width:1150px;min-width:0}h2{font-size:25px;line-height:1.35;margin:10px 0 13px}h3{font-size:17px;margin:0 0 13px}.meta{font-size:12px;color:#62736e;line-height:1.8}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.badge{font-size:11px;border-radius:4px;background:#e0e9e5;padding:5px 8px}.badge.reviewed{background:#d5e9df;color:#21523e}.source{border:1px solid #d1dbd6;border-radius:8px;background:white;padding:16px;margin:18px 0;box-shadow:0 5px 25px #18392d08}.source img{width:100%;height:auto;max-width:900px;display:block;margin:auto}.links{display:flex;gap:16px;font-size:12px;margin:13px 0}a{color:#216769;text-decoration:none}a:hover{text-decoration:underline}.panel{background:white;border:1px solid #d4dfd9;border-radius:8px;padding:22px;margin:18px 0;line-height:1.8}.panel p{margin:8px 0 16px;overflow-wrap:anywhere}.note{background:#f7efdc;border:1px solid #e6d6ae;border-radius:6px;padding:13px 16px;font-size:13px;line-height:1.7}.review{border-left:4px solid #408369}.caption{font-size:12px;color:#6b7d73}.english{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.75}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f3;padding:14px;border-radius:5px;font-size:13px;line-height:1.6}details{margin:12px 0}summary{cursor:pointer;font-weight:550;color:#295a5c}li{margin:8px 0}ul{padding-left:21px}.math-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:15px}.math-card{border:1px solid #d8dfdb;border-radius:6px;padding:10px;background:#fcfdfc}.math-card img{width:100%;height:180px;object-fit:contain}.math-card code{font-size:12px;display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:9px}.empty{padding:35px;color:#718079}.footer{font-size:12px;color:#627970;padding:20px 0}
@media(max-width:850px){.workspace{grid-template-columns:1fr}aside{position:relative;height:auto;border-right:0}#list{max-height:230px;overflow:auto}main{padding:18px}header{padding:25px 22px}.stats{gap:18px}h1{font-size:25px}}
.derivation{border-left:4px solid #317d69}.derivation h1{font-size:25px;color:#173f42}.derivation h2{font-size:21px;margin-top:32px;padding-top:16px;border-top:1px solid #dbe4df}.derivation h3{margin-top:22px}.derivation table{display:block;width:100%;overflow:auto;border-collapse:collapse;font-size:13px}.derivation th,.derivation td{padding:9px 12px;border-bottom:1px solid #d7e1da;text-align:left;vertical-align:top}.derivation th{background:#edf3ef}.derivation img{width:100%;height:auto;display:block;background:white;margin:24px 0}.derivation .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:12px 0}.derivation .katex{font-size:1.04em}.chapter-link{display:inline-block;color:#fff;background:#285658;border:1px solid #6d9890;padding:8px 15px;margin-top:17px;border-radius:5px;font-size:14px}
.sfg-group{margin:14px 0;padding:14px;background:#f8fbf9;border:1px solid #ccdcd4;border-radius:7px}.sfg-group h4{margin:0 0 8px;line-height:1.5}.sfg-group p{line-height:1.7}.slide-choices{display:flex;flex-wrap:wrap;gap:5px}.slide-choices .item{width:auto;padding:8px;font-size:12px;border:1px solid #cddbd6}.slide-choices .item.active{border-color:#9b7e38;background:#fff7e1}#other-cases{margin-top:22px;border-top:1px solid #bccfc6;padding-top:16px}#other-cases>summary{padding:8px 0}.links{flex-wrap:wrap}
</style></head><body>
<header><div class="eyebrow">ANALOG DESIGN ESSENTIALS · WILLY SANSEN</div><h1>SFG 分析案例</h1><p>优先展示已判断需要信号流图的案例：从独立局部约束出发，用电压与电流节点保留器件因果方向。其他幻灯片收在折叠区，可按需展开或搜索。</p><a class="chapter-link" href="../derivations/ch02/index.html">第二章公式推导 · Markdown 解释与近似条件 →</a> <a class="chapter-link" href="../simulations/ch02/index.html">Spectre 仿真结果 →</a><div class="stats" id="stats"></div></header>
<div class="workspace"><aside><input class="filter" id="search" aria-label="搜索" placeholder="搜索全部案例、公式或编号…"><select class="filter" id="chapter" aria-label="章节"><option value="">全部章节</option></select><select class="filter" id="type" aria-label="内容类型"><option value="">全部内容</option><option value="sfg-used">已采用 SFG 的案例</option><option value="derivation">第二章公式推导</option><option value="reviewed">已核对代表案例</option><option value="math">有公式 OCR 候选</option><option value="graph">图形相关候选</option><option value="feedback">反馈相关候选</option><option value="sfg">SFG 待评估候选</option></select><div id="count" role="status"></div><h3>需要 SFG 的案例</h3><div id="list"></div><details id="other-cases"><summary id="other-summary">其他幻灯片</summary><p class="caption">包含不需要 SFG 的内容和仍待评估的候选；展开后按原始编号浏览。</p><div id="other-list"></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></details><div class="footer"><a href="README.md">抽取说明</a> · <a href="catalog.csv">CSV 索引</a> · <a href="statistics.json">统计</a><br>本地离线数据；无外部字体、服务或上传。</div></aside><main id="detail"></main></div>
<script id="data" type="application/json">__CASES_JSON__</script>
<script id="derivations" type="application/json">__DERIVATIONS_JSON__</script>
<script>
const derivations=JSON.parse(document.querySelector('#derivations').textContent);
const data=JSON.parse(document.querySelector('#data').textContent),stats=__STATS_JSON__;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tagLabels={circuit:'电路',graph:'曲线图',frequency_response:'频率响应',feedback:'反馈',noise:'噪声',distortion:'失真',reference:'参考文献'};
const text=(tag,t,cls='')=>`<${tag} class="${cls}">${esc(t)}</${tag}>`;
const usesSfg=c=>c.derivation?.sfg==='used';
const sfgCases=data.filter(usesSfg),defaultCase=sfgCases[0]?.case_id||data[0].case_id;
$('#stats').innerHTML=[['SFG 分析组',new Set(sfgCases.map(c=>c.derivation.module_id)).size],['相关幻灯片',sfgCases.length],['其他幻灯片 · 默认折叠',data.length-sfgCases.length]].map(([l,n])=>`<div class="stat"><b>${n.toLocaleString()}</b><span>${l}</span></div>`).join('');
for(let i=1;i<=24;i++){const c=data.find(x=>x.chapter===i);$('#chapter').add(new Option(`${String(i).padStart(2,'0')} · ${c.chapter_title}`,i))}
function hashCase(){try{return decodeURIComponent(location.hash.slice(1))}catch{return ''}}
let selected=hashCase()||defaultCase,filtered=data,page=0;const size=35;
const searchIndex=new Map(data.map(c=>[c.case_id,[c.case_id,c.title,c.commentary_text,c.ocr.lines.map(l=>l.text).join(' '),c.reviewed_extraction?.summary_zh||'',c.derivation?.title||'',c.derivation?.summary_zh||''].join(' ').toLowerCase()]));
function filter(preserveSelection=false){
 const q=$('#search').value.trim().toLowerCase(),ch=$('#chapter').value,t=$('#type').value;
 filtered=data.filter(c=>(!ch||c.chapter==ch)&&(!q||searchIndex.get(c.case_id).includes(q))&&(!t||(t==='sfg-used'?usesSfg(c):t==='derivation'?!!c.derivation:t==='reviewed'?!!c.reviewed_extraction:t==='math'?c.formula_candidates.length:t==='sfg'?c.sfg_triage.priority==='candidate':c.content_tags.values.includes(t))));
 page=0;
 if(!preserveSelection){
  selected=filtered.find(usesSfg)?.case_id||'';
  history.replaceState(null,'',location.pathname+location.search+(selected?'#'+selected:''));
 }
 show(false);
}
function renderList(){
 const primary=filtered.filter(usesSfg),other=filtered.filter(c=>!usesSfg(c)),groups=new Map();
 for(const c of primary){const id=c.derivation.module_id;if(!groups.has(id))groups.set(id,[]);groups.get(id).push(c)}
 $('#count').textContent=`筛选结果：${groups.size} 组 SFG 案例 · ${other.length} 张其他幻灯片（见折叠区）`;
 $('#list').innerHTML=[...groups.values()].map(cases=>`<section class="sfg-group"><h4>${esc(cases[0].derivation.title)}</h4><p class="caption">${esc(cases[0].derivation.sfg_reason)}</p><div class="slide-choices">${cases.map(c=>`<button class="item ${c.case_id===selected?'active':''}" data-id="${c.case_id}" title="${esc(c.title)}">幻灯片 ${c.slide_id}</button>`).join('')}</div></section>`).join('')||'<p class="caption">当前筛选无已采用 SFG 的案例；其他匹配结果见下方折叠区。</p>';
 $('#other-summary').textContent=`其他幻灯片（${other.length} 张）`;
 const pages=Math.max(1,Math.ceil(other.length/size));page=Math.min(page,pages-1);
 $('#page').textContent=`${page+1} / ${pages}`;$('#prev').disabled=page===0;$('#next').disabled=page>=pages-1;
 $('#other-list').innerHTML=other.slice(page*size,(page+1)*size).map(c=>`<button class="item ${c.case_id===selected?'active':''}" data-id="${c.case_id}"><small>${c.slide_id} · PDF ${c.slide_images[0].pdf_page}${c.derivation?' · 含推导':c.reviewed_extraction?' · 已核对':''}</small><strong>${esc(c.title)}</strong></button>`).join('')||'<p class="caption">没有符合的其他幻灯片。</p>';
 for(const id of ['#list','#other-list'])$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;selected=b.dataset.id;show(false)});
}
function excerpts(c,field,title){return `<details><summary>${esc(title)} (${c[field].length})</summary><ul>${c[field].map(e=>`<li>${esc(e.text)} <span class="caption">[PDF ${e.pdf_page}]</span></li>`).join('')||'<li>规则未找到；不表示原页没有相关内容。</li>'}</ul></details>`}
function derivationPanel(c){const d=c.derivation;if(!d)return '';const m=derivations[d.module_id];if(!m)return '';
return `<section class="panel derivation"><h3>公式推导 · Markdown 解释</h3><div class="links"><a href="${d.html}">独立推导页</a><a href="${d.markdown}">Markdown 原稿</a><a href="../derivations/ch02/00-conventions.html">共同模型与假设</a></div><p>${esc(d.summary_zh)}</p>${d.discrepancy_ids.length?`<div class="note">本页含来源差异 ${d.discrepancy_ids.map(esc).join('、')}。请连同模型与近似条件阅读；有疑义的教材原式未标为已证明。<a href="../derivations/ch02/discrepancies.html">差异表</a></div>`:''}<p class="caption">${esc(d.sfg_reason)} 下方推导合并处理相关幻灯片，原始页码列于末尾。</p>${m.html}</section>`}
function show(fromHash=true){
 if(fromHash)selected=hashCase()||defaultCase;
 if(!selected){$('#detail').innerHTML='<section class="panel"><h2>选择案例</h2><p>当前筛选无已采用 SFG 的案例。请展开“其他幻灯片”查看匹配内容，或调整筛选条件。</p></section>';renderList();return}
 const c=data.find(c=>c.case_id===selected)||data.find(c=>c.case_id===defaultCase),a=c.slide_images[0],r=c.reviewed_extraction;selected=c.case_id;
 if(!usesSfg(c)){$('#other-cases').open=true;const index=filtered.filter(x=>!usesSfg(x)).findIndex(x=>x.case_id===selected);if(index>=0)page=Math.floor(index/size)}
 const pdf='../../'+encodeURIComponent('Analog Design Essentials (Willy Sansen).pdf')+'#page='+a.pdf_page;
let review='';if(r){review=`<section class="panel review"><h3>第一步已核对的代表案例</h3><p>${esc(r.summary_zh)}</p><p class="caption">若本页另有第二章推导，请优先依其完整模型与差异注记阅读。抽取核对范围仅涵盖下列已填内容；其余 OCR 候选仍需核对。</p>${r.formulas.map(f=>`<pre>${esc(f.latex)}</pre><p>${esc(f.meaning_zh)}</p>`).join('')}${[['topology_zh','连接关系'],['graph_conclusions_zh','曲线结论'],['conditions_zh','条件与近似注记']].map(([k,t])=>r[k]?.length?`<h3>${t}</h3><ul>${r[k].map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'').join('')}${r.related_slide_ids?'<p>关联幻灯片：'+r.related_slide_ids.map(id=>`<a href="#SANSEN-${id}">${id}</a>`).join(' · ')+'</p>':''}</section>`}
$('#detail').innerHTML=`<div class="meta">第 ${String(c.chapter).padStart(2,'0')} 章 · ${esc(c.chapter_title)}</div><h2>${esc(c.title)}</h2><div class="meta">幻灯片 ${c.slide_id} · 图片位于 PDF 第 ${a.pdf_page} 页 / 书本第 ${a.printed_page} 页<br>讲解涵盖 PDF ${[...new Set(c.commentary_segments.map(s=>s.pdf_page))].join(', ')} 页</div><div class="badges"><span class="badge ${r?'reviewed':''}">${c.derivation?'第二章已对照推导与条件':r?'代表案例已核对':'语义尚未逐项核对'}</span>${c.content_tags.values.map(t=>text('span',(tagLabels[t]||t)+' 候选','badge')).join('')}</div><div class="note">公式原图是核对依据。OCR 可能误认分数、上下标、希腊字母或正负号；以下候选摘录与关键词标签不是已完成的电路解析。</div><div class="source"><img src="${a.path}" alt="幻灯片 ${c.slide_id} 原图"><div class="links"><a href="${a.path}" target="_blank">原始图片</a><a href="${pdf}" target="_blank">原 PDF 页面</a><a href="cases/${c.case_id}.json">JSON</a><a href="cases/${c.case_id}.md">Markdown</a></div></div>${derivationPanel(c)}${review}<section class="panel"><h3>对应教材讲解</h3>${c.commentary_segments.map(s=>`<div class="caption">PDF ${s.pdf_page} · 书本 ${s.printed_page}</div><p class="english">${esc(s.text)}</p>`).join('')}<p class="caption">保留正文文本层；正文中的数学符号也可能错位。</p></section><section class="panel"><h3>原文候选摘录</h3><p class="caption">依规则定位相关句子，保留页码，尚未逐张完成语义判读。</p>${excerpts(c,'analysis_objective_excerpts','分析目标')}${excerpts(c,'source_conclusions','公式 / 性能结论')}${excerpts(c,'graph_conclusion_excerpts','曲线结论')}${excerpts(c,'explicit_assumption_excerpts','条件与近似')}</section><section class="panel"><h3>公式 OCR 候选 · ${c.formula_candidates.length}</h3><p class="caption">下列图片是候选行的周边裁切，可能包含其他内容，也可能没有涵盖完整公式。没有找到候选不表示本页没有公式。</p><details><summary>展开候选图片与识别文本</summary><div class="math-grid">${c.formula_candidates.map(f=>`<div class="math-card"><img loading="lazy" src="${f.context_crop}" alt="${f.id}"><code>${esc(f.ocr_text)}</code><span class="caption">OCR 置信度 ${f.confidence.toFixed(2)} · 尚未核对</span></div>`).join('')}</div></details><details><summary>完整幻灯片 OCR</summary><pre>${esc(c.ocr.lines.map(l=>l.text).join('\n'))}</pre></details></section>`;renderList()}
$('#search').oninput=()=>filter();$('#chapter').onchange=()=>filter();$('#type').onchange=()=>filter();$('#prev').onclick=()=>{page--;renderList()};$('#next').onclick=()=>{page++;renderList()};window.onhashchange=()=>{show();$('#detail').scrollIntoView({behavior:'smooth',block:'start'})};filter(true);
</script></body></html>
